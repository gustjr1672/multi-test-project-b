name: Deploy Project B (Self-Hosted, 개선판)

# 개선점:
#  - cancel-in-progress: false → 진행 중 무중단 배포를 도중에 끊지 않고 큐잉
#    (배포 중 SIGKILL 로 인한 서버 간 버전 불일치/반쪽 전환 방지)
#  -  matrix 로 통합 (라벨만 다르고 내용 동일했음)
#  - chmod +x 제거 (bash 로 실행하므로 실행 비트 불필요)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'          # 마크다운 문서 수정 시 무시
      - '.gitignore'     # gitignore 수정 시 무시
      #- 'docs/**'        # 문서 폴더 수정 시 무시
  workflow_dispatch: # 수동 배포 버튼 활성화

jobs:
  deploy:
    # 두 대의 self-hosted runner(dev, dev2)에 동일 릴리스를 병렬 배포.
    # fail-fast: false → 한 서버 실패가 다른 서버 배포를 취소하지 않음.
    strategy:
      fail-fast: false
      matrix:
        target: [ dev, dev2 ]

    runs-on: [ self-hosted, project-b, "${{ matrix.target }}" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment Script
        env:
          DB_URL: ${{ secrets.DB_URL }}
          # 운영 서버별 경로/컨테이너명이 다르면 아래 값을 secrets/vars 로 주입 가능.
          # MASTER_CONF: ${{ vars.MASTER_CONF }}
          # NGINX_CONTAINER: ${{ vars.NGINX_CONTAINER }}
        run: bash deploy.sh
